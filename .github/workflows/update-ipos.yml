name: Update IPO data

on:
  schedule:
    # Hourly 09:05–19:05 IST on weekdays (UTC below) while issues open, close and list,
    # plus 21:05 IST on weekdays and a daily 07:05 IST run (weekends too)
    - cron: "35 3-13 * * 1-5"
    - cron: "35 15 * * 1-5"
    - cron: "35 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]   # never commit data to feature branches
    paths: ["data/overrides.json", "data/applications.json"]

permissions:
  contents: write

concurrency:
  group: update-ipos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Check out the latest main when the job starts, not the commit that triggered it. Runs are
      # queued (concurrency group), so a queued run otherwise works on a stale commit and its push is rejected.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Scrape and update
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python -m scraper.update --offline; else python -m scraper.update; fi
      - name: Commit changes
        run: |
          git config user.name "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add docs/data data/applications.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: IPO update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git push || { git pull --rebase origin main && git push; }
